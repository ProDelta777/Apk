name: bluechat
description: "A cross-platform mobile app for offline Bluetooth mesh chat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  nearby_connections: ^3.1.2
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  encrypt: ^5.0.3
  uuid: ^4.3.3
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  geolocator: ^11.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6
  intl: ^0.19.0
  path_provider: ^2.1.2
  crypto: ^3.0.3
  flutter_spinkit: ^5.2.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
